<!--
  Junto — "Reset password" email template.
  Paste into Supabase → Authentication → Email Templates → Reset password.
  Uses {{ .ConfirmationURL }} (routes through /auth/reset-password → the app,
  where the user sets a new password). Inline styles only — email clients
  strip <style> and external CSS. Logo served from https://getjunto.app.
  Visually identical to confirm-signup.html.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F5F1E8;margin:0;padding:32px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="440" cellpadding="0" cellspacing="0" style="background:#FFFFFF;border-radius:20px;overflow:hidden;max-width:440px;width:100%;box-shadow:0 6px 24px rgba(20,30,20,0.08);">
        <tr>
          <td align="center" style="padding:40px 32px 8px;">
            <img src="https://getjunto.app/junto-logo.png" width="72" height="72" alt="Junto" style="border-radius:18px;display:block;" />
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:16px 40px 4px;">
            <h1 style="margin:0;font-size:24px;font-weight:800;color:#14261C;letter-spacing:-0.3px;">Réinitialise ton mot de passe</h1>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:12px 44px 8px;">
            <p style="margin:0;font-size:16px;line-height:1.55;color:#5B6B60;">
              Tu as demandé à changer ton mot de passe. Clique ci-dessous pour en choisir un nouveau.
            </p>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:28px 40px 8px;">
            <a href="{{ .ConfirmationURL }}"
               style="display:inline-block;background:#2FA46A;color:#FFFFFF;text-decoration:none;font-size:16px;font-weight:700;padding:15px 40px;border-radius:999px;">
              Choisir un nouveau mot de passe
            </a>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:20px 44px 40px;">
            <p style="margin:0;font-size:13px;line-height:1.5;color:#9AA69E;">
              Tu n'as pas demandé ça&nbsp;? Ignore ce message, ton mot de passe reste inchangé.
            </p>
          </td>
        </tr>
      </table>
      <p style="margin:20px 0 0;font-size:12px;color:#A7AFA9;">Junto — sorties sportives outdoor entre passionnés</p>
    </td>
  </tr>
</table>
