name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint, Typecheck & Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Informational: the remaining high advisories are transitive Expo build
      # tooling (not shipped in the app) and kept CI red for weeks, so nobody
      # read it any more (2026-11-04). Lint and typecheck stay blocking.
      - name: Security audit (informational)
        run: npm audit --audit-level=high
        continue-on-error: true
