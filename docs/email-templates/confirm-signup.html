<!--
  askandgo — "Confirm signup" email template (copy of the live one, 2026-10-28).
  Paste into Supabase → Authentication → Email Templates → Confirm signup.
  Links straight to the site with {{ .TokenHash }} (the page exchanges it,
  then hands over to the app) — no raw token in the URL. Inline styles only:
  email clients strip <style> and external CSS. Logo served from askandgo.io.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#E7EEE8;margin:0;padding:40px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="440" cellpadding="0" cellspacing="0" style="background:#FFFFFF;border:2px solid #14261C;border-radius:14px;max-width:440px;width:100%;">
        <tr>
          <td align="center" style="padding:36px 32px 0;">
            <img src="https://askandgo.io/askandgo-logo.png" width="64" height="64" alt="askandgo" style="border-radius:16px;display:block;" />
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:18px 40px 0;">
            <h1 style="margin:0;font-size:23px;font-weight:800;color:#14261C;letter-spacing:-0.3px;">Bienvenue sur askandgo&nbsp;!</h1>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:10px 44px 0;">
            <p style="margin:0;font-size:15px;line-height:1.55;color:#4A5A50;">
              Confirme ton adresse email pour commencer à trouver, créer et rejoindre des sorties outdoor, là où tu veux partir.
            </p>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:26px 40px 4px;">
            <a href="https://askandgo.io/auth/callback?token_hash={{ .TokenHash }}&type=signup"
               style="display:inline-block;background:#2FA46A;color:#FFFFFF;text-decoration:none;font-size:16px;font-weight:700;padding:15px 38px;border-radius:10px;">
              Confirmer mon email
            </a>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:18px 44px 34px;">
            <p style="margin:0;font-size:13px;line-height:1.5;color:#8A968E;">
              Tu n'as pas créé de compte askandgo&nbsp;? Ignore simplement ce message.
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
