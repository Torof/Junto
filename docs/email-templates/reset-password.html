<!--
  Junto — "Reset password" email template.
  Paste into Supabase → Authentication → Email Templates → Reset password.
  Uses {{ .ConfirmationURL }} (routes through /auth/reset-password → the app,
  where the user sets a new password). Inline styles only — email clients
  strip <style> and external CSS. Logo served from https://getjunto.app.
  Same layout as confirm-signup.html.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#E7EEE8;margin:0;padding:40px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="440" cellpadding="0" cellspacing="0" style="background:#FFFFFF;border:2px solid #14261C;border-radius:14px;max-width:440px;width:100%;">
        <tr>
          <td align="center" style="padding:36px 32px 0;">
            <img src="https://getjunto.app/junto-logo.png" width="64" height="64" alt="Junto" style="border-radius:16px;display:block;" />
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:18px 40px 0;">
            <h1 style="margin:0;font-size:23px;font-weight:800;color:#14261C;letter-spacing:-0.3px;">Réinitialise ton mot de passe</h1>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:10px 44px 0;">
            <p style="margin:0;font-size:15px;line-height:1.55;color:#4A5A50;">
              Tu as demandé à changer ton mot de passe. Clique ci-dessous pour en choisir un nouveau.
            </p>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:26px 40px 4px;">
            <a href="{{ .ConfirmationURL }}"
               style="display:inline-block;background:#2FA46A;color:#FFFFFF;text-decoration:none;font-size:16px;font-weight:700;padding:15px 38px;border-radius:10px;">
              Choisir un nouveau mot de passe
            </a>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:18px 44px 34px;">
            <p style="margin:0;font-size:13px;line-height:1.5;color:#8A968E;">
              Tu n'as pas demandé ça&nbsp;? Ignore ce message, ton mot de passe reste inchangé.
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
